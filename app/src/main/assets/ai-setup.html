<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>电视 AI 配置</title><link rel="stylesheet" href="/css/ui.css">
<style>
:root{color-scheme:light dark;scrollbar-color:var(--md-outline) var(--md-surface);scrollbar-width:auto}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--md-surface)}::-webkit-scrollbar-thumb{background:var(--md-outline);border:2px solid var(--md-surface);border-radius:6px}::-webkit-scrollbar-thumb:hover{background:var(--md-on-surface-variant)}
body{height:auto;min-height:100%;line-height:1.6}main{max-width:520px;margin:auto;padding:32px 20px calc(24px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
h1{font-size:26px;line-height:1.3;margin:8px 0 12px}p,.help{color:var(--md-on-surface-variant)}.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em}#device{font:12px monospace;margin-top:8px}form{margin-top:24px}label.field{display:block;font-size:15px;font-weight:600;margin-top:20px}.md-input{margin-top:6px;width:100%;height:52px;font-size:16px}.help{font-size:13px;margin:6px 0}.error{min-height:22px;font-size:13px;color:var(--md-error)}.key-row{display:flex;align-items:center;gap:8px}.key-row input{min-width:0;flex:1}.key-row button{flex:0 0 auto;min-height:48px;margin-top:6px}.toggle{display:flex;align-items:center;gap:12px;min-height:52px;cursor:pointer}.toggle input{width:22px;height:22px;accent-color:var(--md-primary)}button{cursor:pointer}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,input:focus-visible{outline:3px solid var(--md-primary);outline-offset:3px}button:disabled{opacity:.55;cursor:default}#submit{min-height:52px;margin-top:16px;font-size:16px}#status{min-height:54px;margin-top:16px}#retry{margin-top:8px}#pasteKey{min-height:48px}#keyPasteHelp{min-height:42px}input[aria-invalid=true]{border-color:var(--md-error)}[hidden]{display:none!important}
</style>
</head>
<body><main>
<p class="eyebrow" data-i18n="eyebrow">片多多 · 电视设置</p><h1 data-i18n="title">用手机填写 AI 配置</h1>
<p data-i18n="intro">保存到当前电视，之后即可使用 AI 辅助弹幕匹配，无需另备服务器。</p><p id="device"></p>
<form id="form" novalidate hidden>
<label class="field" for="base" data-i18n="base">接口地址</label><input class="md-input" id="base" name="base" type="url" inputmode="url" autocapitalize="none" spellcheck="false" aria-describedby="baseError"><div class="error" id="baseError"></div>
<label class="field" for="model" data-i18n="model">模型名称</label><input class="md-input" id="model" name="model" maxlength="120" autocapitalize="none" spellcheck="false" aria-describedby="modelHelp modelError"><p class="help" id="modelHelp" data-i18n="modelHelp">默认 qwen3.5-flash；请确认你的服务商支持该模型，费用以实际计费为准。</p><div class="error" id="modelError"></div>
<label class="field" for="key">API Key</label><div class="key-row"><input class="md-input" id="key" name="api-key" type="password" inputmode="text" maxlength="4096" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-describedby="keyHelp keyPasteHelp keyError"><button class="md-btn md-btn-tonal" type="button" id="reveal" aria-pressed="false" data-i18n="show">显示</button></div><p class="help" id="keyHelp"></p><button class="md-btn md-btn-tonal" type="button" id="pasteKey" aria-controls="key" data-i18n="pasteKey">粘贴填写</button><p class="help" id="keyPasteHelp" role="status" aria-live="polite"></p><div class="error" id="keyError"></div>
<label class="toggle"><input id="enabled" type="checkbox" checked><span data-i18n="enabled">启用 AI 辅助匹配</span></label>
<p class="help" data-i18n="privacy">密钥通过当前局域网发送到电视，并加密保存在电视上；网页不保留密钥。</p>
<button class="md-btn md-btn-filled md-btn-full" type="submit" id="submit" data-i18n="save">保存到电视</button>
</form>
<p id="status" role="status" aria-live="polite"></p><button id="retry" class="md-btn md-btn-tonal" type="button" hidden data-i18n="retry">重新连接</button>
</main>
<script>
'use strict';
const zh={pasteKey:'粘贴填写',pasteHelp:'先复制 Key，再点“粘贴填写”，长按输入框选择“粘贴”。',pasteHint:'已切换普通输入：长按输入框选择“粘贴”。粘贴后或离开输入框会自动隐藏。',pasted:'已粘贴并隐藏密钥。请点击“保存到电视”。',emptyClipboard:'剪贴板没有文字，请先复制 API Key。',eyebrow:'片多多 · 电视设置',title:'用手机填写 AI 配置',intro:'保存到当前电视，之后即可使用 AI 辅助弹幕匹配，无需另备服务器。',base:'接口地址',model:'模型名称',modelHelp:'默认 qwen3.5-flash；请确认你的服务商支持该模型，费用以实际计费为准。',enabled:'启用 AI 辅助匹配',privacy:'密钥通过当前局域网发送到电视，并加密保存在电视上；网页不保留密钥。',show:'显示',hide:'隐藏',save:'保存到电视',saving:'正在保存…',loading:'正在连接电视…',retry:'重新连接',ready:'请保持电视二维码窗口打开，二维码 10 分钟有效。',saved:'已保存到电视。你可以关闭此页面，在电视上测试连接。',expired:'二维码已失效或已完成保存。请查看电视；如需继续配置，请刷新二维码后重新扫描。',network:'暂时连接不到电视。请确认仍在同一 Wi-Fi，电视二维码窗口保持打开后重试。',saveFailed:'保存失败，输入内容已保留。请重试。',badBase:'请填写 HTTPS 接口地址，不包含密钥、查询参数或 #。',badModel:'请填写 1–120 个字符的模型名称。',badKey:'请填写 API Key；更换接口地址时需重新填写密钥。',hasKey:'电视已保存密钥，留空可保留。更换接口地址时需重新填写。',noKey:'粘贴服务商提供的 API Key。',device:'当前电视：'};
const en={pasteKey:'Paste entry',pasteHelp:'Copy your key, tap “Paste entry”, then touch and hold the field to paste.',pasteHint:'Normal input is ready. Touch and hold the field to paste. The key is hidden after pasting or leaving the field.',pasted:'Key pasted and hidden. Tap “Save to TV” to finish.',emptyClipboard:'No text on the clipboard. Copy your API Key first.',eyebrow:'TV settings',title:'Set up AI from your phone',intro:'Save to this TV to assist danmaku matching. No separate server is needed.',base:'Endpoint URL',model:'Model name',modelHelp:'Default: qwen3.5-flash. Check availability and pricing with your provider.',enabled:'Enable AI-assisted matching',privacy:'The key is sent over your local network and stored encrypted on the TV. This page does not retain it.',show:'Show',hide:'Hide',save:'Save to TV',saving:'Saving…',loading:'Connecting to TV…',retry:'Reconnect',ready:'Keep the QR window open on your TV. The code expires after 10 minutes.',saved:'Saved to TV. You can close this page and test the connection on your TV.',expired:'This code has expired or was already used. Check your TV; refresh the QR code to configure again.',network:'Cannot reach the TV. Stay on the same Wi-Fi and keep the QR window open, then retry.',saveFailed:'Could not save. Your input is preserved; try again.',badBase:'Enter an HTTPS endpoint without credentials, query parameters or a fragment.',badModel:'Enter a model name of 1–120 characters.',badKey:'Enter an API Key. A new key is required when changing the endpoint.',hasKey:'A key is already saved on the TV. Leave blank to retain it; enter a new key when changing the endpoint.',noKey:'Paste the API Key supplied by your provider.',device:'TV: '};
const tw={...zh,pasteKey:'貼上填寫',pasteHelp:'先複製 Key，再點「貼上填寫」，長按輸入框選擇「貼上」。',pasteHint:'已切換一般輸入：長按輸入框選擇「貼上」。貼上後或離開輸入框會自動隱藏。',pasted:'已貼上並隱藏密鑰。請點擊「儲存至電視」。',emptyClipboard:'剪貼簿沒有文字，請先複製 API Key。',eyebrow:'片多多 · 電視設定',title:'用手機填寫 AI 設定',intro:'儲存至目前電視，之後即可使用 AI 輔助彈幕配對，無需另備伺服器。',base:'介面位址',model:'模型名稱',modelHelp:'預設 qwen3.5-flash；請確認服務商支援該模型，費用以實際計費為準。',enabled:'啟用 AI 輔助配對',privacy:'密鑰透過目前區域網路傳送至電視，並加密儲存在電視上；網頁不保留密鑰。',show:'顯示',hide:'隱藏',save:'儲存至電視',saving:'正在儲存…',loading:'正在連接電視…',retry:'重新連線',ready:'請保持電視二維碼視窗開啟，二維碼 10 分鐘有效。',saved:'已儲存至電視。你可以關閉此頁面，在電視上測試連線。',expired:'二維碼已失效或已完成儲存。請查看電視；如需繼續設定，請重新整理二維碼後掃描。',network:'暫時無法連接電視。請確認仍在同一 Wi-Fi，電視二維碼視窗保持開啟後重試。',saveFailed:'儲存失敗，輸入內容已保留。請重試。',badBase:'請填寫 HTTPS 介面位址，不包含密鑰、查詢參數或 #。',badModel:'請填寫 1–120 個字元的模型名稱。',badKey:'請填寫 API Key；更換介面位址時需重新填寫密鑰。',hasKey:'電視已儲存密鑰，留空可保留。更換介面位址時需重新填寫。',noKey:'貼上服務商提供的 API Key。',device:'目前電視：'};
const language=navigator.language||'zh-CN', t=/^zh-(TW|HK|Hant)/i.test(language)?tw:/^zh/i.test(language)?zh:en;
document.documentElement.lang=t===en?'en':t===tw?'zh-TW':'zh-CN';document.title=t.title;
document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
const el=id=>document.getElementById(id), token=location.hash.slice(1);let original='',hasKey=false,busy=false,dirty=false;
el('device').textContent=t.device+location.host;
el('keyPasteHelp').textContent=t.pasteHelp;
function status(message){el('status').textContent=message;}
async function api(path,data){const control=new AbortController(), timer=setTimeout(()=>control.abort(),12000);try{const response=await fetch('/ai-setup/'+path,{method:data?'POST':'GET',headers:{'X-Pairing-Token':token,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined,cache:'no-store',signal:control.signal});const result=await response.json();if(!response.ok)throw new Error(result.code||'network');return result;}finally{clearTimeout(timer);}}
function error(field,message){el(field+'Error').textContent=message;el(field).setAttribute('aria-invalid',message?'true':'false');}
async function connect(){el('retry').hidden=true;status(t.loading);try{if(!/^[a-f0-9]{48}$/.test(token))throw new Error('expired');const config=await api('config');original=config.baseUrl;hasKey=config.hasKey;el('base').value=original;el('model').value=config.model;el('enabled').checked=hasKey?config.enabled:true;el('keyHelp').textContent=hasKey?t.hasKey:t.noKey;el('form').hidden=false;status(t.ready);}catch(e){status(e.message==='expired'?t.expired:t.network);el('retry').hidden=e.message==='expired';}}
el('retry').addEventListener('click',connect);
// A separate, explicit paste mode avoids OEM password keyboards. LAN HTTP cannot
// rely on navigator.clipboard; the browser's native paste gesture works here.
let pasteMode=false;
function showKey(show){el('key').type=show?'text':'password';el('reveal').textContent=show?t.hide:t.show;el('reveal').setAttribute('aria-pressed',String(show));}
el('reveal').addEventListener('click',()=>{pasteMode=false;showKey(el('key').type==='password');el('keyPasteHelp').textContent=t.pasteHelp;});
function preparePaste(){showKey(true);pasteMode=true;el('keyPasteHelp').textContent=t.pasteHint;}
// An empty field can accept a first tap/long press without ever requesting a password IME.
el('key').addEventListener('pointerdown',()=>{if(!el('key').value)preparePaste();});
el('pasteKey').addEventListener('click',()=>{
    preparePaste();
    // Change the type before focusing so the IME starts in normal text mode.
    el('key').focus();el('key').select();
});
el('key').addEventListener('blur',()=>{
    // Changing an input's type may itself move focus. Check the final focus
    // after this event, so entering paste mode does not cancel itself.
    Promise.resolve().then(()=>{if(pasteMode&&document.activeElement!==el('key')){pasteMode=false;showKey(false);el('keyPasteHelp').textContent=t.pasteHelp;}});
});
el('key').addEventListener('paste',event=>{
    if(!pasteMode||!event.clipboardData)return;
    event.preventDefault();const value=event.clipboardData.getData('text').trim();
    if(!value){el('keyPasteHelp').textContent=t.emptyClipboard;return;}
    el('key').value=value;dirty=true;error('key','');
    // Blur before restoring password semantics; never open the password IME
    // merely to hide a value that was pasted using the normal keyboard.
    pasteMode=false;el('key').blur();showKey(false);el('keyPasteHelp').textContent=t.pasted;el('pasteKey').focus();
});
el('form').addEventListener('input',()=>dirty=true);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
el('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;['base','model','key'].forEach(f=>error(f,''));const base=el('base').value.trim().replace(/\/+$/,''),model=el('model').value.trim(),key=el('key').value.trim(),enabled=el('enabled').checked;let first='';try{const u=new URL(base);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw 0;}catch(_){error('base',t.badBase);first='base';}if(!model||model.length>120){error('model',t.badModel);first=first||'model';}if((!key&&((enabled&&!hasKey)||(hasKey&&base!==original)))||key.length>4096||/[\r\n]/.test(key)){error('key',t.badKey);first=first||'key';}if(first){el(first).focus();return;}busy=true;el('submit').disabled=true;el('submit').textContent=t.saving;el('form').setAttribute('aria-busy','true');try{await api('save',{baseUrl:base,model,key,enabled});dirty=false;el('key').value='';el('form').hidden=true;status(t.saved);}catch(e){if(e.message==='expired')status(t.expired);else if(['base_url','model','key'].includes(e.message)){const field=e.message==='base_url'?'base':e.message;error(field,t[{base:'badBase',model:'badModel',key:'badKey'}[field]]);el(field).focus();status(t.saveFailed);}else status(t.saveFailed+' '+t.network);}finally{busy=false;el('submit').disabled=false;el('submit').textContent=t.save;el('form').removeAttribute('aria-busy');}});
connect();
</script></body></html>
