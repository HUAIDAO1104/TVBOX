plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
rootProject.file('local.properties').withInputStream {
    localProps.load(it)
}

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.fongmi.android.tv"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep compatibility fixes on a strictly newer version so TV installers do not retain
        // the previous APK while preserving its database for the migration chain below.
        versionCode 593
        versionName "5.5.42-danmaku-title-match"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["mode", "abi"]

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")

        // Mobile and TV used to be two unrelated applications that happened to share the
        // same data layer.  Keep a single landscape presentation source of truth so every
        // home/search/detail/player/settings and splash change is identical on both APKs.
        // The product flavor is still `mobile`, therefore update selection, device reporting,
        // soft-keyboard behaviour and mobile-specific runtime checks continue to work.
        mobile {
            java.setSrcDirs(["src/leanback/java"])
            res.setSrcDirs(["src/leanback/res"])
            manifest.srcFile "src/leanback/AndroidManifest.xml"
        }
    }

    signingConfigs {
        release {
            storeFile file(localProps['storeFile'])
            keyAlias localProps['keyAlias']
            keyPassword localProps['keyPassword'] ?: localProps['storePassword']
            storePassword localProps['storePassword']
            // Several Android 9 projector firmwares cannot inspect V2-only archives through
            // PackageManager. Keep V1 for their pre-install compatibility check while retaining
            // V2/V3 integrity protection for modern Android versions.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
            if (name.toLowerCase().contains('androidtest')) {
                force 'org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1'
                force 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1'
                force 'org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.8.1'
                force 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
                force 'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.8.1'
            }
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        def flavors = variant.productFlavors.collectEntries { [(it.first): it.second] }
        def mode = flavors['mode'] ?: 'mode'
        def abi = flavors['abi'] ?: 'abi'
        variant.outputs.each { output ->
            output.outputFileName.set("${mode}-${abi}.apk")
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation libs.appcompat
    implementation libs.lifecycle.service
    implementation libs.media
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.android.gif.drawable
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.rtmp.client
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
    implementation libs.textdrawable
    leanbackImplementation libs.leanback
    leanbackImplementation libs.androidautosize
    // The mobile flavor intentionally renders the exact TV landscape experience.  These are
    // flavor-scoped as well so the shared TV activities and 960x540 adaptive layout compile
    // without promoting TV-only dependencies to the common data layer.
    mobileImplementation libs.leanback
    mobileImplementation libs.androidautosize
    mobileImplementation libs.biometric
    mobileImplementation libs.zxing.android.embedded
    annotationProcessor libs.room.compiler
    annotationProcessor libs.eventbus.annotation.processor
    annotationProcessor libs.glide.compiler
    coreLibraryDesugaring libs.desugar
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:5.4.0'
}
