<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>片多多 · 双端观看设计稿</title>
<style>
:root { color-scheme:dark; font:16px/1.55 system-ui,sans-serif; background:#101318; color:#f4f5f7; --line:#39414e; --muted:#adb7c6; --accent:#ff6575 }
* { box-sizing:border-box } body { max-width:1320px; margin:auto; padding:32px clamp(12px,4vw,52px) }
h1,h2,h3,p { margin:0 } h1 {font-size:clamp(26px,4vw,42px);font-weight:720} header p,figcaption,small {color:var(--muted)}
header {margin-bottom:24px} fieldset {border:0;padding:0;margin:0;display:flex;gap:6px;flex-wrap:wrap} legend {font-size:13px;color:var(--muted);padding-bottom:5px}
button,label {font:inherit} .filters {display:flex;flex-wrap:wrap;gap:16px 36px;margin-bottom:22px}
label {cursor:pointer;display:inline-block} input {position:absolute;width:1px;height:1px;opacity:0}
label span {display:inline-block;border-radius:20px;border:1px solid var(--line);padding:5px 14px} input:checked+span {background:#f1f1f3;border-color:transparent;color:#14171b} input:focus-visible+span {outline:3px solid #ff6575}
main {display:grid;grid-template-columns:minmax(295px,.7fr) minmax(420px,1.45fr);gap:22px;align-items:start}
figure {margin:0}figcaption {margin-bottom:7px;font-size:14px}
.screen {border:1px solid var(--line);border-radius:18px;background:#141920;overflow:hidden;position:relative}
.phone {max-width:410px;min-height:540px;display:flex;flex-direction:column}.phone section {flex:1;padding:18px}.tv {min-height:330px;aspect-ratio:16/9;padding:22px 28px;background:#11151b}.tv section {margin-top:16px}
nav,footer,.metadata,.row,.rail {display:flex;gap:10px;align-items:center;flex-wrap:wrap}nav {padding:12px 18px;border-bottom:1px solid var(--line);justify-content:space-between}footer {justify-content:space-around;border-top:1px solid var(--line);padding:14px 4px;font-size:13px;color:var(--muted)}
.tv nav {padding:0 0 12px}.tv nav small {font-size:14px}.phone h2 {font-size:22px}.tv h2 {font-size:clamp(20px,2.3vw,33px)}
h3 {margin:17px 0 8px;font-size:16px} .row {background:#212831;padding:12px;border-radius:9px;flex-wrap:nowrap;margin-top:7px}.row div:last-child {min-width:0}
.em {color:#ff8b98;font-weight:bold}.metadata {color:var(--muted);font-size:13px}.hero {margin-top:14px;padding:19px 15px;background:#232c38;border-radius:12px}
.hero p {font-weight:620;font-size:20px}.cta,.chip {display:inline-block;border-radius:7px;background:#303844;padding:6px 11px;margin:6px 6px 3px 0;font-weight:600;font-size:14px}.cta {background:#f4f5f7;color:#15171a}.tv .focused {outline:3px solid #fff;outline-offset:3px}
progress {width:100%;height:5px;accent-color:var(--accent)}.poster {height:62px;width:45px;flex:none;background:#353c48;border-radius:5px;color:#d6dbe3;display:grid;place-items:center;font-weight:650;font-size:18px}
.state {padding:24px 14px;border:1px solid var(--line);margin-top:14px;border-radius:10px}.loading {height:66px;border-radius:8px;background:linear-gradient(115deg,#232932,#303a47);margin:10px 0}
.poster.cover {background:linear-gradient(150deg,#9aabb0,#285867 60%,#1d3545);color:white;font-family:serif}.row:nth-of-type(even) .cover {background:linear-gradient(150deg,#9e8d7b,#644b45)}
section p.note {font-size:13px;margin:8px 0;color:var(--muted)}.board-note {margin:18px 0;color:var(--muted);max-width:72em} .phone .playing {aspect-ratio:16/9;background:#090b0d;padding:12px;display:flex;align-items:end;justify-content:space-between;border-radius:8px}
@media(max-width:860px){main{grid-template-columns:1fr}.phone{max-width:100%;min-height:400px}.tv{min-height:300px;padding:16px}.filters{gap:12px}}
</style>
<header><h1>双端观看设计稿</h1><p>片多多 v5.5.101 · 首页、详情、搜索与个人内容</p></header>
<div class="filters"><fieldset id="views"><legend>页面</legend></fieldset><fieldset id="states"><legend>内容状态</legend></fieldset></div>
<main><figure><figcaption>手机 · 触摸</figcaption><div class="screen phone"><nav><b>片多多</b><small>搜索</small></nav><section id="mobile"></section><footer id="tabs"></footer></div></figure>
<figure><figcaption>电视 · 遥控器</figcaption><div class="screen tv"><nav><b>片多多</b><small>首页　搜索　历史　直播</small></nav><section id="television"></section></div><p class="board-note" id="behavior"></p></figure></main>
<script>
const pages=['首页','详情','搜索','个人内容'], states=['常态','空内容','加载中','失败','无海报'];
const explanations=[
 '手机点续播卡进入对应剧集。电视优先聚焦未看完的影片，返回时保留首页位置。',
 '手机画面内操作投屏、全屏、弹幕和设置。电视用焦点框标出当前操作，用播放图标和勾选标志区分正在播放与已看。',
 '默认按来源显示命中。选择作品分组后仍可展开来源。年份和版本不明时保留各条结果。',
 '手机能直接打开追剧、已缓存的视频和扫码配对。电视历史页提供续播和手机配对入口。两端独立改动同一条记录时显示双方进度。'
];
const empty=['还没有观看记录','此来源暂无可播放剧集','没有找到匹配影片','还没有追剧或观看记录'];
const recovery=['浏览分类','更换来源','修改关键词','浏览影片'];
const names=['小城良方','现在就出发'];
let page=0, state=0;
function options(id, values, action) {
 const group=document.getElementById(id);
 values.forEach((title,i)=>{const label=document.createElement('label'), input=document.createElement('input'), text=document.createElement('span');
 input.type='radio';input.name=id;input.checked=i===0;text.textContent=title;input.addEventListener('change',()=>{action(i);draw()});
 label.append(input,text);group.append(label)});
}
function card(title, detail, focused=false) {
 return '<div class="row'+(focused?' focused':'')+'"><span class="poster'+(state===4?'':' cover')+'" aria-label="示例封面">'+title[0]+'</span><div><b>'+title+'</b><div class="metadata">'+detail+'</div></div></div>';
}
function action(name, tv=false) {return '<span class="cta'+(tv?' focused':'')+'">'+name+'</span>'}
function view(tv) {
 let s='<h2>'+(['首页','小城良方','搜索「小城良方」',tv?'观看历史':'追剧'][page])+'</h2>';
 if(state===1) return s+'<div class="state"><b>'+empty[page]+'</b><p>'+action(recovery[page],tv)+'</p></div>'+(page===3?action('手机与电视续播'):'');
 if(state===2) return s+'<div class="loading"></div><div class="metadata">'+['正在加载片单','正在获取剧集','其他来源仍在搜索','正在读取本地记录'][page]+'</div>'+(page===2?card(names[0],'已返回 · 花卷线路'):'');
 if(state===3) return s+'<div class="state"><b>'+['片单加载失败','此线路暂时无法播放','部分来源搜索失败','电视暂时离线'][page]+'</b><p>'+action(['重试','换线路','重试此来源','立即同步'][page],tv)+'</p></div>'+(page===2||page===3?card(names[0],'已保存 · 第 8 集'):'');
 if(page===0) s+='<div class="hero"><small>继续观看</small><p>小城良方</p><div class="metadata">第 8 集 · 18:42 / 45:00</div><progress max="2700" value="1122"></progress>'+action('继续播放',tv)+'</div><h3>'+(tv?'精选':'追剧上新')+'</h3>'+card(names[1], '综艺 · 更新至最新一期');
 if(page===1) s+=(tv?'':'<div class="playing"><span>▷</span><small>投屏　弹幕　设置　全屏</small></div>')+'<p class="note">花卷线路 · 第 8 集</p>'+action('继续第 8 集 · 18:42',tv)+'<span class="chip">选集</span>'+(tv?'':'<span class="chip">追剧</span><span class="chip">下载</span>')+'<h3>剧集</h3><div class="rail"><span class="chip">✓ 7</span><span class="chip em">▶ 8</span><span class="chip">9</span></div><h3>剧情简介</h3>';
 if(page===2) s+='<div class="metadata">按来源　　同作品分组</div>'+card(names[0],'花卷线路 · 上次看过',tv)+card(names[0],'其他来源 · 选择线路');
 if(page===3) s+=(tv?action('手机同步'):action('手机与电视续播'))+'<div class="metadata">'+(tv?'最近观看':'在追　历史　收藏')+'</div>'+card(names[0],tv?'花卷线路 · 第 8 集 · 18:42':'已看 7 / 24 集',tv);
 if(state===4) s+='<p class="note">保留片名、来源和进度，海报位置使用片名占位。</p>';
 return s;
}
function draw(){document.getElementById('mobile').innerHTML=view(false);document.getElementById('television').innerHTML=view(true);
document.getElementById('tabs').innerHTML=['首页','追剧','下载','我的'].map((x,i)=>'<span class="'+(i===(page===3?1:0)?'em':'')+'">'+x+'</span>').join('');
document.getElementById('behavior').textContent=explanations[page];}
options('views',pages,i=>page=i);options('states',states,i=>state=i);draw();
</script></html>
