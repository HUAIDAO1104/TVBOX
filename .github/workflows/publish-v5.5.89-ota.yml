name: Publish v5.5.89 OTA update

on:
  push:
    branches: [codex/fix/mobile-dlna-upgrade]
    paths: [.github/workflows/publish-v5.5.89-ota.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-v5.5.89-ota
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply reviewed native receiver fix
        run: |
          set -euo pipefail
          echo '925753ffcbe0d25e3bd10a909c784f23198e24f8a1b006d62d52496059e1ddd7  cast-native-large-file.patch' | sha256sum --check
          if git apply --reverse --check cast-native-large-file.patch 2>/dev/null; then
            echo 'Native receiver fixes are already present.'
          else
            git apply --check cast-native-large-file.patch
            git apply --index cast-native-large-file.patch
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: serve native DLNA file probes with verified lengths and ranges'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          git rev-parse HEAD > source-commit.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
          # Use the JDK selected above; preserve the project's IDE-specific criteria.
          mv gradle/gradle-daemon-jvm.properties "$RUNNER_TEMP/gradle-daemon-jvm.properties"
          cat > "$RUNNER_TEMP/mobile-upgrade.init.gradle" <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') { android.buildToolsVersion = '37.0.0' }
              plugins.withId('com.android.library') { android.buildToolsVersion = '37.0.0' }
              plugins.withId('com.chaquo.python') {
                  chaquopy.defaultConfig.pip.options '--index-url', 'https://pypi.org/simple'
                  chaquopy.defaultConfig.pip.options '--extra-index-url', 'https://chaquo.com/pypi-13.1'
                  chaquopy.defaultConfig.pip.options '--find-links', new File(System.getenv('RUNNER_TEMP'), 'android-python-wheels').absolutePath
              }
          }
          GRADLE

      - name: Fetch verified Android Python wheels
        run: |
          mkdir -p "$RUNNER_TEMP/android-python-wheels"
          cd "$RUNNER_TEMP/android-python-wheels"
          cat > SHA256SUMS <<'WHEELS'
          811547210b01eefb0fb850fd35bd27b53a00a76b9466b8c03e049b7e8175004b  chaquopy_libcxx-180000-0-py3-none-android_24_arm64_v8a.whl
          7082afa716eb1960852d432a73c90f40b017fbd83de7c427760a29f60b6169cc  chaquopy_libcxx-180000-0-py3-none-android_24_armeabi_v7a.whl
          d4134ea2c0f632372a436ee54467f30d5f7744c2e9ea83ffc3edb9080ddff6c1  chaquopy_libxml2-2.9.8-2-py3-none-android_16_armeabi_v7a.whl
          f8a7adf4f565e4cec6add811a9886be2191e8214913987dce24a3bb522dcb4e3  chaquopy_libxml2-2.9.8-2-py3-none-android_21_arm64_v8a.whl
          a7b58f9627c68555a592d6295e8f79542035e358d0b35b14da7b0dc599ef1962  chaquopy_libxslt-1.1.32-2-py3-none-android_16_armeabi_v7a.whl
          0526c414fc0af6f02b9e922042c79e3aa0e3c28fe093de3a38d834755ffc2a27  chaquopy_libxslt-1.1.32-2-py3-none-android_21_arm64_v8a.whl
          3cd17d5b607accd9c6d92b79dd93388b9661da46e8bae6baed9f1dd4732f3076  lxml-5.3.0-0-cp310-cp310-android_24_arm64_v8a.whl
          be03590d8aa1dca946375b646fa93d3a6ba5e2c89084abc35244d4c7c6e3ee31  lxml-5.3.0-0-cp310-cp310-android_24_armeabi_v7a.whl
          8c9a9e983fee98565c305ac3f6a6d6e2ca90ccbc302eabd1ec5c521c047e5274  pycryptodome-3.21.0-0-cp310-cp310-android_24_arm64_v8a.whl
          ae645325c2883ef84dd5dc7933760f889b06a8f8786facdf354a0c7f7d65c755  pycryptodome-3.21.0-0-cp310-cp310-android_24_armeabi_v7a.whl
          6ec5eb9e25f4177257b2348d3a68708e2cba07fa3da4171d872979aca0fe969f  ujson-5.11.0-0-cp310-cp310-android_24_arm64_v8a.whl
          8778731ebb168f94003cc8c202c80692ba64ad5e0c5775af4a9b309c8f4495fe  ujson-5.11.0-0-cp310-cp310-android_24_armeabi_v7a.whl
          WHEELS
          while read -r digest wheel; do
            package="${wheel%%-*}"
            package="${package//_/-}"
            curl --fail --location --retry 3 --max-time 120 "https://chaquo.com/pypi-13.1/$package/$wheel" -o "$wheel"
          done < SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Restore existing release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          printf 'storeFile=%s\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.keystore" "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" > local.properties
          keytool -exportcert -keystore "$RUNNER_TEMP/release.keystore" -alias "$KEY_ALIAS" \
            -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/signing-public.der"
          echo "b8ed9c579e8671d24f6d4d18b296528ca655c627fa437f57a217450c0b548aa7  $RUNNER_TEMP/signing-public.der" | sha256sum --check

      - name: Install decoder used by integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Verify streaming and real first-frame decoding
        env:
          CAST_FFMPEG: /usr/bin/ffmpeg
        run: |
          bash gradlew --no-daemon --max-workers=2 -I "$RUNNER_TEMP/mobile-upgrade.init.gradle" \
            :app:testMobileArm64_v8aDebugUnitTest --tests 'com.fongmi.android.tv.server.Cast*'
          python3 - <<'TESTS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          roots = [ET.parse(p).getroot() for p in Path('app/build/test-results').rglob('TEST-*Cast*.xml')]
          assert roots
          assert all(int(r.get('failures', 0)) == 0 and int(r.get('errors', 0)) == 0 and int(r.get('skipped', 0)) == 0 for r in roots)
          assert sum(int(r.get('tests', 0)) for r in roots) >= 44
          print('44 casting regressions passed, including 2+ GiB index probes and 4K HEVC 10-bit / E-AC-3 decoding.')
          TESTS

      - name: Build all four original signed APKs
        run: |
          bash gradlew --no-daemon --max-workers=2 -I "$RUNNER_TEMP/mobile-upgrade.init.gradle" \
            :app:assembleMobileArm64_v8aRelease :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease :app:assembleLeanbackArmeabi_v7aRelease

      - name: Verify all four original upgrade packages
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt"
          mkdir -p dist verification
          for product in mobile leanback; do
            for abi in arm64_v8a armeabi_v7a; do
              apk="$(find app/build/outputs/apk -path "*/release/$product-$abi.apk" -print -quit)"
              test -f "$apk"
              cp "$apk" "dist/pianduoduo-$product-$abi-v5.5.89.apk"
            done
          done
          for apk in dist/*.apk; do
            name="$(basename "$apk" .apk)"
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 "$apk" > "verification/$name-signature.txt"
            actual="$(sed -n 's/.*certificate SHA-256 digest: //p' "verification/$name-signature.txt" | sort -u)"
            test "$actual" = b8ed9c579e8671d24f6d4d18b296528ca655c627fa437f57a217450c0b548aa7
            grep -q 'Verified using v1 scheme (JAR signing): true' "verification/$name-signature.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "verification/$name-signature.txt"
            grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "verification/$name-signature.txt"
            "$AAPT" dump badging "$apk" > "verification/$name-metadata.txt"
            grep -q "^package: name='com.fongmi.android.tv' versionCode='640' versionName='5.5.89'" "verification/$name-metadata.txt"
            ! grep -q '^application-debuggable' "verification/$name-metadata.txt"
            python3 scripts/check_android_io_compat.py "$apk"
          done

      - name: Generate the shared mobile and TV update manifest
        run: |
          python3 scripts/generate_update_manifest.py \
            --repo "$GITHUB_REPOSITORY" --version-code 640 --version-name 5.5.89 --tag v5.5.89 \
            --notes '改进电视内置接收端读取大文件及 MKV 索引的兼容性：修复错误的文件大小、范围请求和未知长度响应。保留原签名，可直接覆盖更新。' \
            --asset leanback-armeabi_v7a=dist/pianduoduo-leanback-armeabi_v7a-v5.5.89.apk \
            --asset leanback-arm64_v8a=dist/pianduoduo-leanback-arm64_v8a-v5.5.89.apk \
            --asset mobile-armeabi_v7a=dist/pianduoduo-mobile-armeabi_v7a-v5.5.89.apk \
            --asset mobile-arm64_v8a=dist/pianduoduo-mobile-arm64_v8a-v5.5.89.apk \
            --output dist/latest.json
          (cd dist && sha256sum *.apk latest.json > SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          改进内置 DLNA 接收端读取大文件及 MKV 索引的兼容性，保留原版包名和签名，可覆盖安装并保留数据。

          - 用 GET 已验证的完整文件大小响应 HEAD，避免上游返回 0 字节导致电视无法打开视频。
          - 将尾部、开放结束位置、超过文件末尾的 Range 请求转换为明确的有效范围，全程使用 64 位文件偏移。
          - 使用已验证的文件大小或 Content-Range 返回明确长度，避免将可定位的 MKV 作为未知长度分块流发送。
          - 拒绝错误的索引位置；不通过顺序下载数 GB 视频来跳过上游忽略的范围请求。
          - 补齐并统一 DIDL 与 HTTP 的 DLNA 功能信息。保持原始媒体流，无整片下载或重编码等待。
          - 44 项回归测试通过：覆盖 2.7 GB 文件的头部和尾部探测、4K H.265 10 位与 E-AC-3 音频实际解码、HLS 首帧及 MKV 内嵌字幕保留。
          - 手机与电视 ARM64 / ARMv7 均为 5.5.89（640），提供统一应用内更新清单。

          验证范围：已修复并复现上述 HTTP 兼容性缺陷；尚未取得用户当前花卷集数的带鉴权播放地址，也未在该台创维的爱投屏上实测，因此不能认定这些缺陷就是该设备问题的全部原因。本版不增加转码能力；若接收端不支持片源的编码、HDR 或音轨，仍可能无法播放，可使用已能播放的乐播接收端。

          NOTES
          printf '\nSource: %s\n' "$(cat source-commit.txt)" >> "$RUNNER_TEMP/release-notes.md"

      - name: Upload verification records
        uses: actions/upload-artifact@v4
        with:
          name: TVBOX-v5.5.89-OTA-verification
          path: |
            verification/
            source-commit.txt
            app/build/test-results/
            dist/latest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Stage and verify release assets before making latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v5.5.89 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v5.5.89 already exists; refusing to replace published packages.' >&2
            exit 1
          fi
          gh release create v5.5.89 dist/*.apk dist/latest.json dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft \
            --target "$(cat source-commit.txt)" \
            --title 'v5.5.89 · 内置投屏大文件兼容修复' \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          # A draft does not have a public tag yet. Resolve it from the authenticated release list.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "v5.5.89" and .draft == true) | .id')"
          test -n "$release_id"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/staged-release.json"
          python3 - <<'VERIFY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'staged-release.json').read_text())
          assert release['draft'] and not release['prerelease']
          remote = {a['name']: a for a in release['assets']}
          local = {p.name: p for p in Path('dist').iterdir() if p.is_file()}
          assert remote.keys() == local.keys()
          for name, path in local.items():
              assert remote[name]['size'] == path.stat().st_size, name
              assert remote[name]['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest(), name
          manifest = json.loads(Path('dist/latest.json').read_text())
          assert manifest['versionCode'] == 640 and manifest['versionName'] == '5.5.89'
          assert len(manifest['apks']) == 4
          for asset in manifest['apks'].values():
              assert remote[asset['fileName']]['digest'] == 'sha256:' + asset['sha256']
              assert remote[asset['fileName']]['size'] == asset['size']
          print('All six release assets match; mobile and TV OTA manifest verified.')
          VERIFY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=true > /dev/null
          echo '### Published v5.5.89 (640) with verified mobile and TV OTA assets' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://github.com/HUAIDAO1104/TVBOX/releases/tag/v5.5.89' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" local.properties
